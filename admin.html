<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real - TalonarioDigital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>

        /* --- ESTILOS ESPECÍFICOS DEL CHAT --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #chatContainer {
            width: 95%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 80vh; /* Altura fija para el chat */
            overflow: hidden;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            padding: 15px;
            margin: 0;
            border-bottom: 1px solid #eee;
        }

        /* Área de visualización de mensajes */
        #messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Estilo de mensaje individual */
        .message-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message-bubble strong {
            display: block;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .message-bubble small {
            display: block;
            margin-top: 5px;
            font-size: 0.7em;
            color: rgba(0, 0, 0, 0.5);
            text-align: right;
        }

        /* Mensajes del usuario actual (a la derecha) */
        .my-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #3498db, #1e90ff);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        /* Mensajes de otros usuarios (a la izquierda) */
        .other-message {
            align-self: flex-start;
            background: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
        }

        /* Formulario de entrada */
        #messageForm {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
        }

        #messageInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            margin-right: 10px;
            resize: none;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
        }

        #sendButton {
            padding: 10px 15px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #sendButton:hover {
            background: #27ae60;
        }
        
        /* Estilos de autenticación (similares a talonario.html) */
        .auth-status {
            text-align: center;
            padding: 10px;
            color: #e74c3c;
            font-weight: 600;
        }

        .auth-info {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .auth-info a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        
        /* Regresar */
        #backButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background: #34495e;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        
        #backButton:hover {
            background: #2c3e50;
        }
    </style>
</head>
<body>
    <a id="backButton" href="talonario.html"><i class="fas fa-arrow-left"></i> Volver al Talonario</a>

    <div id="chatContainer">
        <h2><i class="fas fa-comments"></i> Chat del Proyecto</h2>
        
        <div id="authStatus" class="auth-status">Verificando sesión...</div>

        <div id="messages">
            </div>

        <form id="messageForm">
            <textarea id="messageInput" placeholder="Escribe tu mensaje..." rows="1" required></textarea>
            <button type="submit" id="sendButton" disabled>Enviar</button>
        </form>
    </div>

    <div id="notificacion" class="notificacion" style="display: none; position: fixed; top: 20px; right: 20px; background: #00ff7f; color: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 127, 0.7); z-index: 2000;">
        <p id="mensajeNotificacion"></p>
    </div>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        query, 
        orderBy, 
        limit, 
        onSnapshot,
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    import { 
        getAuth, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";


    // ** REEMPLAZA ESTO CON TU CONFIGURACIÓN REAL DE FIREBASE **
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 
    
    // Referencia a la colección de mensajes
    const messagesRef = collection(db, "chats"); 

    let currentUser = null; 
    let unsubscribeChat = null; 

    // --- ELEMENTOS DEL DOM ---
    const authStatus = document.getElementById('authStatus');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const messagesContainer = document.getElementById('messages');

    // --- FUNCIÓN DE AUTENTICACIÓN Y CONTROL DE ACCESO ---
    function setupAuthListeners() {
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // AUTENTICADO
                currentUser = user;
                authStatus.innerHTML = `Conectado como: <strong>${user.email}</strong>`;
                authStatus.style.color = '#2ecc71';
                sendButton.disabled = false;
                
                // Iniciar la escucha de mensajes
                if (!unsubscribeChat) {
                    startChatListener();
                }
            } else {
                // NO AUTENTICADO: Redireccionar o mostrar mensaje
                currentUser = null;
                authStatus.innerHTML = `No autenticado. <a href="index.html">Iniciar sesión</a>.`;
                authStatus.style.color = '#e74c3c';
                sendButton.disabled = true;
                
                if (unsubscribeChat) {
                    unsubscribeChat();
                    unsubscribeChat = null;
                }
                
                // Redireccionar (opcional, si solo quieres que usuarios logueados accedan)
                // window.location.href = 'index.html'; 
            }
        });
    }


    // --- FUNCIÓN PARA ENVIAR MENSAJES ---
    async function sendMessage(e) {
        e.preventDefault();
        
        const text = messageInput.value.trim();
        
        if (text.length === 0 || !currentUser) {
            return; 
        }

        try {
            await addDoc(messagesRef, {
                uid: currentUser.uid,
                email: currentUser.email,
                text: text,
                timestamp: serverTimestamp() // Usa la marca de tiempo del servidor
            });
            
            messageInput.value = ''; // Limpiar el input
            
        } catch (error) {
            console.error("Error al enviar el mensaje:", error);
            mostrarNotificacion("⚠️ Error al enviar el mensaje.");
        }
    }

    // --- FUNCIÓN PARA ESCUCHAR MENSAJES EN TIEMPO REAL ---
    function startChatListener() {
        // Consulta: Ordena por timestamp (ascendente) y limita a los últimos 50 mensajes
        const q = query(messagesRef, orderBy("timestamp", "asc"), limit(50));
        
        unsubscribeChat = onSnapshot(q, (snapshot) => {
            
            messagesContainer.innerHTML = ''; // Limpiar la lista actual
            
            snapshot.forEach(doc => {
                const data = doc.data();
                const isMyMessage = data.uid === currentUser.uid;
                
                const bubble = document.createElement('div');
                bubble.classList.add('message-bubble');
                bubble.classList.add(isMyMessage ? 'my-message' : 'other-message');

                const senderName = isMyMessage ? 'Tú' : (data.email || 'Anónimo').split('@')[0];
                
                // Formatear la marca de tiempo si existe
                let time = '';
                if (data.timestamp && data.timestamp.toDate) {
                    const date = data.timestamp.toDate();
                    time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                bubble.innerHTML = `
                    <strong>${senderName}:</strong>
                    ${data.text}
                    <small>${time}</small>
                `;
                
                messagesContainer.appendChild(bubble);
            });
            
            // Desplazar al final automáticamente
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

        }, (error) => {
            console.error("Error al recibir mensajes:", error);
            mostrarNotificacion("Error de conexión con el chat.");
        });
    }

    // --- FUNCIÓN DE NOTIFICACIÓN ---
    function mostrarNotificacion(mensaje) {
        const notificacion = document.getElementById('notificacion');
        const mensajeNotificacion = document.getElementById('mensajeNotificacion');
        
        notificacion.style.background = mensaje.includes('Error') || mensaje.includes('⚠️') ? '#ff4757' : '#00ff7f';
        notificacion.style.boxShadow = mensaje.includes('Error') || mensaje.includes('⚠️') ? '0 0 15px rgba(255, 71, 87, 0.7)' : '0 0 15px rgba(0, 255, 127, 0.7)';
        
        mensajeNotificacion.textContent = mensaje;
        
        notificacion.style.animation = 'none';
        notificacion.offsetHeight; 
        notificacion.style.animation = 'slideIn 0.5s ease forwards, slideOut 0.5s ease 2.5s forwards';

        notificacion.style.display = 'block';
        setTimeout(() => { notificacion.style.display = 'none'; }, 3000);
    }

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {
        messageForm.addEventListener('submit', sendMessage);
        setupAuthListeners();
        
        // Ajustar altura del input de mensaje
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = (messageInput.scrollHeight) + 'px';
        });
    });

</script>
</body>
</html>
