<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalonarioDigital - Panel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #c8d9e8);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor-admin {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 800px;
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        #contador {
            font-size: 1.5em;
            font-weight: 600;
            color: #2ecc71;
            margin-bottom: 20px;
            text-align: center;
            padding: 10px;
            background: #e9f7ef;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 0.9em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #estadoAdmin {
            color: #e74c3c;
            font-weight: 600;
            text-align: center;
            margin-top: 20px;
        }
        
        #volverBtn {
            padding: 10px 20px;
            background: #34495e;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        #volverBtn:hover {
            background: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="contenedor-admin">
        <h2>Panel de Administración de Usuarios</h2>
        
        <p id="estadoAdmin">Verificando permisos...</p>
        
        <div id="contenidoAdmin" style="display: none;">
            <div id="contador">Total de Usuarios Registrados: 0</div>
            
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Email</th>
                        <th>UID de Usuario</th>
                        <th>Fecha de Registro</th>
                        <th>Admin</th>
                    </tr>
                </thead>
                <tbody id="listaUsuarios">
                    </tbody>
            </table>
        </div>
        <button id="volverBtn" onclick="window.location.href='talonario.html'">Volver al Talonario</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

        // ⚠️ CONFIGURACIÓN DE FIREBASE: UTILIZA LA MISMA QUE EN TODOS TUS ARCHIVOS
        const firebaseConfig = {
            apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
            authDomain: "talonario-rifa.firebaseapp.com",
            projectId: "talonario-rifa",
            storageBucket: "talonario-rifa.appspot.com",
            messagingSenderId: "987446023081",
            appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
            measurementId: "G-FWH8F9SVFM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const perfilesRef = collection(db, 'perfiles');

        const estadoAdmin = document.getElementById('estadoAdmin');
        const contenidoAdmin = document.getElementById('contenidoAdmin');
        const listaUsuarios = document.getElementById('listaUsuarios');
        const contador = document.getElementById('contador');

        // --- FUNCIONES DE ADMINISTRACIÓN ---

        async function cargarListaUsuarios() {
            listaUsuarios.innerHTML = '';
            let contadorUsuarios = 0;
            
            try {
                // Esta línea requiere el permiso 'list' en las Reglas de Seguridad de Firestore.
                const snapshot = await getDocs(perfilesRef); 
                contadorUsuarios = snapshot.size;

                snapshot.docs.forEach((d, index) => {
                    const data = d.data();
                    const fila = document.createElement('tr');
                    
                    // Manejar la fecha de creación
                    const fecha = data.createdAt && typeof data.createdAt.toDate === 'function' 
                                  ? data.createdAt.toDate().toLocaleDateString() 
                                  : 'N/A';
                    const esAdmin = data.isAdmin ? 'Sí' : 'No';

                    fila.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${data.email || 'N/A'}</td>
                        <td title="${d.id}">${d.id.substring(0, 15)}...</td>
                        <td>${fecha}</td>
                        <td>${esAdmin}</td>
                    `;
                    listaUsuarios.appendChild(fila);
                });

                contador.textContent = `Total de Usuarios Registrados: ${contadorUsuarios}`;
            } catch (error) {
                console.error("Error al cargar usuarios:", error);
                // Muestra el error de permisos si falla
                estadoAdmin.textContent = "Error al cargar la lista. Es un fallo de permisos. ¡Asegúrate que las Reglas de Seguridad son correctas y estás logeado como Admin!";
            }
        }
        
        // --- GUARDIA DE SEGURIDAD Y PERMISOS ---
        
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // No autenticado: Redirigir al login
                window.location.href = 'index.html';
                return;
            }
            
            try {
                // 1. Obtener el perfil del usuario logeado
                const perfilDoc = await getDoc(doc(db, 'perfiles', user.uid));
                
                // 2. Verificar el campo 'isAdmin: true'
                if (perfilDoc.exists() && perfilDoc.data().isAdmin === true) {
                    // PERMISO CONCEDIDO
                    estadoAdmin.style.display = 'none';
                    contenidoAdmin.style.display = 'block';
                    cargarListaUsuarios();
                    
                } else {
                    // PERMISO DENEGADO
                    estadoAdmin.textContent = "Acceso Denegado. No tienes permisos de administrador.";
                    estadoAdmin.style.color = '#e74c3c';
                    
                    // Redirigir al talonario después de un retraso
                    setTimeout(() => { window.location.href = 'talonario.html'; }, 3000); 
                }
            } catch (error) {
                console.error("Error al verificar permisos:", error);
                estadoAdmin.textContent = "Error grave al verificar permisos. Redirigiendo...";
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            }
        });
    </script>
</body>
</html>
