<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Pública - TalonarioDigital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Reutilizamos los estilos clave del talonario para mantener el diseño */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #ffffff;
            color: #2c3e50;
            padding: 15px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.8em;
            margin: 0;
        }
        #message {
            font-size: 1em;
            color: #34495e;
            margin-top: 5px;
        }
        #publicTalonario {
            max-width: 600px;
            width: 100%;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 5px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 8px;
            table-layout: fixed;
        }
        td {
            width: 10%;
            height: 45px;
            font-size: clamp(0.9em, 2.5vw, 1.1em);
            font-weight: 600;
            text-align: center;
            border-radius: 6px;
            cursor: default;
            user-select: none;
            background: linear-gradient(135deg, #6dd5fa, #2980b9); /* Disponible por defecto */
            color: #fff;
        }
        
        /* Colores de estado (copiados de tu CSS) */
        td.apartado {
            background: linear-gradient(135deg, #e74c3c, #c0392b); /* Rojo */
        }
        td.pagado {
            background: linear-gradient(135deg, #2ecc71, #27ae60); /* Verde */
        }
        td.disponible {
             background: linear-gradient(135deg, #6dd5fa, #2980b9); /* Azul */
        }
        td.pagado > span {
            font-size: 1.5em; 
            line-height: 1;
        }

        @media (max-width: 400px) {
            td { height: 35px; font-size: clamp(0.7em, 2vw, 0.8em); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Talonario de Rifa</h1>
        <p id="message">Cargando números...</p>
    </header>

    <div id="publicTalonario">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

        // ** REEMPLAZA ESTO CON TU CONFIGURACIÓN REAL DE FIREBASE **
        const firebaseConfig = {
            apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
            authDomain: "talonario-rifa.firebaseapp.com",
            projectId: "talonario-rifa",
            storageBucket: "talonario-rifa.appspot.com",
            messagingSenderId: "987446023081",
            appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
            measurementId: "G-FWH8F9SVFM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const talonarioContainer = document.getElementById('publicTalonario');
        const messageDisplay = document.getElementById('message');
        
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid'); // Obtener la UID del administrador de la URL

            if (uid) {
                messageDisplay.textContent = 'Mostrando estado actual de la rifa.';
                startPublicListener(uid);
            } else {
                messageDisplay.textContent = '⚠️ Error: No se especificó el ID de la rifa (UID).';
                messageDisplay.style.color = '#e74c3c';
            }
        });

        function startPublicListener(uid) {
            // El listener solo intenta leer la colección de rifas del administrador especificado
            const rifasRef = collection(db, `users/${uid}/rifas`);
            
            onSnapshot(rifasRef, (snapshot) => {
                const datosBoletos = {};
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const numero = doc.id;
                    datosBoletos[numero] = data;
                });

                generarTablaPublica(datosBoletos);
                messageDisplay.textContent = `Actualizado: ${new Date().toLocaleTimeString()}`;
                
            }, (error) => {
                console.error("Error al escuchar la rifa pública:", error);
                messageDisplay.textContent = '🚫 Error al cargar los datos de la rifa. Verifique el enlace o las reglas de seguridad.';
                messageDisplay.style.color = '#e74c3c';
            });
        }
        
        // Función para generar la tabla, similar a la del admin, pero simplificada
        function generarTablaPublica(datosBoletos) { 
            talonarioContainer.innerHTML = ''; 

            const tabla = document.createElement('table');
            let numero = 0;
            for (let i = 0; i < 10; i++) {
                const fila = document.createElement('tr');
                for (let j = 0; j < 10; j++) {
                    const celda = document.createElement('td');
                    const numStr = numero.toString().padStart(2, '0');
                    celda.dataset.numero = numStr;

                    const data = datosBoletos[numStr];
                    const estado = data ? data.estado : 'disponible';

                    celda.classList.remove('apartado', 'pagado', 'disponible');

                    if (estado === 'pagado') {
                        celda.classList.add('pagado');
                        celda.innerHTML = `<span style="font-size: 1.5em; line-height: 1;">💵</span>`; 
                    } else if (estado === 'apartado') {
                        celda.classList.add('apartado');
                        celda.textContent = numStr; 
                    } else {
                        celda.classList.add('disponible');
                        celda.textContent = numStr;
                    }
                    
                    fila.appendChild(celda);
                    numero++;
                }
                tabla.appendChild(fila);
            }
            talonarioContainer.appendChild(tabla);
        }
    </script>
</body>
</html>
