<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalonarioDigital - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
/* --- ESTILOS CSS COMPLETOS --- */

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #e0eafc, #cfdef3);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

header {
    text-align: center;
    margin-bottom: 20px;
    width: 100%;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

h1 {
    color: #2c3e50;
    font-size: clamp(1.8em, 5vw, 2.5em);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    margin: 0;
}

p {
    color: #34495e;
    font-size: clamp(0.9em, 3vw, 1em);
    margin: 10px 0;
}

/* ... (Todos los estilos CSS restantes se mantienen igual) ... */

/* --- VISTA DE LOGIN/TALONARIO --- */
.vista {
    width: 100%;
    max-width: 400px;
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    margin-top: 50px;
}

.vista h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
}

.vista form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.vista input[type="email"], 
.vista input[type="password"] {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 1em;
}

.vista button {
    padding: 10px;
    background: #1e90ff;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
    transition: background 0.2s;
}

.vista button:hover {
    background: #007bff;
}

#toggleAuth {
    background: none;
    color: #34495e;
    border: none;
    font-size: 0.9em;
    margin-top: 10px;
    cursor: pointer;
    text-decoration: underline;
}
/* --------------------------------- */

/* ... (Incluir el resto de estilos para modales, notificaciones, etc. aunque no se usen aquí, por consistencia) ... */

/* Estilos para el icono (debes incluirlos) */
.icono {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #1e90ff, #ff4757);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 0 10px rgba(30, 144, 255, 0.5), 0 0 15px rgba(255, 71, 87, 0.5);
    animation: borderGlow 3s infinite alternate;
}

@keyframes borderGlow {
    0% {
        box-shadow: 0 0 10px rgba(30, 144, 255, 0.5), 0 0 15px rgba(255, 71, 87, 0.5);
    }
    100% {
        box-shadow: 0 0 15px rgba(30, 144, 255, 0.7), 0 0 20px rgba(255, 71, 87, 0.7);
    }
}

.boleto {
    width: 40.5px;
    height: 20.75px;
    background: linear-gradient(135deg, #1e90ff, #ff4757);
    border-radius: 2.5px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: rotate(-10deg) translateY(1.25px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4), 0 0 5px rgba(30, 144, 255, 0.3);
}

.numero {
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 7px;
    text-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
}

.check {
    /* ... (resto del check) ... */
}

/* ... (Media queries también se mantienen) ... */

    </style>
    <link rel="icon" id="favicon" type="image/png" href="icono-talonariodigital.png">
</head>
<body>
    <header>
        <div class="logo">
            <div class="icono">
                <div class="boleto">
                    <span class="numero">Rifa</span>
                    <div class="check"></div>
                </div>
            </div>
            <h1>TalonarioDigital</h1>
        </div>
        <p id="subtituloPrincipal">Inicia sesión para gestionar tu talonario.</p>
        </header>

    <div id="authView" class="vista">
        <h2 id="authTitle">Iniciar Sesión</h2>
        <form id="authForm">
            <input type="email" id="email" placeholder="Correo Electrónico" required>
            <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" required>
            <button type="submit" id="authSubmitBtn">Acceder</button>
        </form>
        <button id="toggleAuth">¿No tienes cuenta? Regístrate</button>
    </div>

    <div id="notificacion" class="notificacion" style="display: none;">
        <p id="mensajeNotificacion"></p>
    </div>

    
<script type="module">
    // Importar solo las funciones necesarias para la autenticación
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    // Tu configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    // Inicializar Firebase y Auth
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); 
    
    // Función de notificación simplificada
    function mostrarNotificacion(mensaje) {
        const notificacion = document.getElementById('notificacion');
        const mensajeNotificacion = document.getElementById('mensajeNotificacion');
        notificacion.style.background = mensaje.includes('Error') ? '#ff4757' : '#00ff7f';
        notificacion.style.boxShadow = mensaje.includes('Error') ? '0 0 15px rgba(255, 71, 87, 0.7)' : '0 0 15px rgba(0, 255, 127, 0.7)';
        
        mensajeNotificacion.textContent = mensaje;
        notificacion.style.animation = 'none';
        notificacion.offsetHeight; 
        notificacion.style.animation = null; 
        notificacion.style.display = 'block';
    }


    function setupAuthListeners() {
        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const toggleAuthBtn = document.getElementById('toggleAuth');
        const authTitle = document.getElementById('authTitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        let isLogin = true;

        toggleAuthBtn.onclick = () => {
            isLogin = !isLogin;
            authTitle.textContent = isLogin ? 'Iniciar Sesión' : 'Registrarse';
            authSubmitBtn.textContent = isLogin ? 'Acceder' : 'Crear Cuenta';
            toggleAuthBtn.textContent = isLogin ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia Sesión';
        };

        authForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                    mostrarNotificacion("¡Sesión iniciada con éxito!");
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    mostrarNotificacion("¡Registro exitoso!");
                }
            } catch (error) {
                // Manejo de errores (se mantiene igual)
                let msg = 'Error desconocido. Verifica tu conexión.';
                if (error.code === 'auth/email-already-in-use') {
                    msg = 'El correo ya está en uso. ¡Intenta iniciar sesión!';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'Correo inválido.';
                } else if (error.code === 'auth/weak-password') {
                    msg = 'Contraseña débil (mín. 6 caracteres).';
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = 'Credenciales incorrectas.';
                } else if (error.code === 'auth/operation-not-allowed') {
                    msg = 'La autenticación con Email/Contraseña no está habilitada en Firebase.';
                }
                mostrarNotificacion(`⚠️ Error: ${msg}`);
            }
        };

        // Escucha el estado de autenticación de Firebase
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // *** CAMBIO CLAVE: REDIRECCIÓN AL ARCHIVO PRINCIPAL ***
                window.location.href = 'talonario.html'; 
            }
            // Si no hay usuario, se queda en esta página.
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setupAuthListeners();
    });

</script>
</body>
</html>
