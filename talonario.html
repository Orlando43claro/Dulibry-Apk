<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talonario Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        #mainContainer {
            width: 95%;
            max-width: 1000px;
            margin: 20px 0;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        /* --- CABECERA Y ESTADO DE RIFAS --- */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        #title {
            color: #2c3e50;
            font-size: 1.8em;
            font-weight: 700;
        }

        #authStatus {
            font-size: 0.9em;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        #authStatus i {
            margin-right: 5px;
        }
        
        /* Línea eliminada: #statusInfo */
        
        /* --- MENÚ DE NAVEGACIÓN Y CONFIGURACIÓN --- */
        #navBar {
            display: flex;
            justify-content: flex-end; /* Alineado a la derecha */
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button i {
            font-size: 1.1em;
        }

        #logoutButton {
            background: #e74c3c;
            color: white;
        }
        #logoutButton:hover { background: #c0392b; transform: translateY(-1px); }

        #chatButton {
            background: #3498db;
            color: white;
            position: relative;
        }
        #chatButton:hover { background: #2980b9; transform: translateY(-1px); }

        /* --- NOTIFICACIÓN DE CHAT --- */
        #chatNotification {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.7em;
            display: none; /* Oculto por defecto */
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }

        /* --- CUADRÍCULA DE NÚMEROS --- */
        #numbersGrid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fdfdff;
        }

        .number-box {
            background: #ecf0f1;
            padding: 15px 5px;
            border-radius: 5px;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            border: 1px solid #ccc;
            user-select: none;
        }

        .number-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Colores de estado */
        .status-disponible { background-color: #2ecc71; color: white; border-color: #27ae60; }
        .status-apartado { background-color: #f39c12; color: white; border-color: #e67e22; }
        .status-pagado { background-color: #3498db; color: white; border-color: #2980b9; }

        /* --- MODAL (POP-UP) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            padding-top: 50px;
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            transition: color 0.2s;
        }

        .close-button:hover,
        .close-button:focus {
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content input[type="text"], 
        .modal-content input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
        }
        
        .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
            background-color: #fff;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .modal-buttons button {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save { background: #2ecc71; color: white; }
        .btn-save:hover { background: #27ae60; }
        
        .btn-pay { background: #3498db; color: white; }
        .btn-pay:hover { background: #2980b9; }

        .btn-delete { background: #e74c3c; color: white; }
        .btn-delete:hover { background: #c0392b; }

        .btn-cancel { background: #95a5a6; color: white; }
        .btn-cancel:hover { background: #7f8c8d; }

        /* Estilos específicos para la sección de rifas */
        #rifasList {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .rifa-card {
            background: #f4f6f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rifa-info strong {
            display: block;
            font-size: 1.1em;
            color: #2c3e50;
        }

        .rifa-info span {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        
        .rifa-buttons button {
            background: #f39c12;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .rifa-buttons button:hover {
            background: #e67e22;
        }
        
        /* --- ESTILO DE NOTIFICACIÓN FLOTANTE --- */
        @keyframes slideIn {
            from { right: -300px; opacity: 0; }
            to { right: 20px; opacity: 1; }
        }

        @keyframes slideOut {
            from { right: 20px; opacity: 1; }
            to { right: -300px; opacity: 0; }
        }

        .notificacion {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2ecc71;
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            font-weight: 600;
            animation: slideIn 0.5s ease forwards, slideOut 0.5s ease 2.5s forwards;
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #numbersGrid {
                grid-template-columns: repeat(5, 1fr);
                gap: 5px;
            }
            #header {
                flex-direction: column;
                align-items: flex-start;
            }
            #title {
                margin-bottom: 10px;
                font-size: 1.5em;
            }
            .modal-content {
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>
    <div id="mainContainer">
        
        <div id="header">
            <h1 id="title">Talonario Digital</h1>
            <div id="authStatus">Verificando sesión...</div>
        </div>
        
        <div id="navBar">
            <button id="chatButton" class="nav-button">
                <i class="fas fa-comments"></i> Chat
                <div id="chatNotification"></div>
            </button>
            <button id="logoutButton" class="nav-button">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
        
        <div id="numbersGrid">
            </div>
        
        <div id="rifasList">
            </div>

    </div>

    <div id="numberModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeModal">&times;</span>
            <h3 id="modalTitle">Número Seleccionado: <span id="selectedNumberDisplay"></span></h3>
            
            <label for="clientName">Nombre del Cliente</label>
            <input type="text" id="clientName" placeholder="Nombre completo" required>
            
            <label for="clientPhone">Teléfono</label>
            <input type="number" id="clientPhone" placeholder="Número de teléfono">
            
            <label for="statusSelect">Estado</label>
            <select id="statusSelect">
                <option value="disponible">Disponible</option>
                <option value="apartado">Apartado</option>
                <option value="pagado">Pagado</option>
            </select>

            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelButton">Cancelar</button>
                <button class="btn-delete" id="deleteButton">Eliminar</button>
                <button class="btn-save" id="saveButton">Guardar</button>
                <button class="btn-pay" id="payButton">Marcar como Pagado</button>
            </div>
        </div>
    </div>

    <div id="notificacion" class="notificacion" style="display: none;">
        <p id="mensajeNotificacion"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            getDoc, 
            setDoc, 
            query, 
            where, 
            onSnapshot,
            getDocs,
            orderBy, 
            limit,
            deleteDoc,
            Timestamp
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";


        // ** REEMPLAZA ESTO CON TU CONFIGURACIÓN REAL DE FIREBASE **
        const firebaseConfig = {
            apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
            authDomain: "talonario-rifa.firebaseapp.com",
            projectId: "talonario-rifa",
            storageBucket: "talonario-rifa.appspot.com",
            messagingSenderId: "987446023081",
            appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
            measurementId: "G-FWH8F9SVFM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // --- VARIABLES GLOBALES ---
        let currentUser = null;
        let selectedNumber = null;
        const totalNumbers = 100;

        // --- REFERENCIAS DEL DOM ---
        const authStatus = document.getElementById('authStatus');
        const numbersGrid = document.getElementById('numbersGrid');
        const rifasList = document.getElementById('rifasList');
        const logoutButton = document.getElementById('logoutButton');
        const chatButton = document.getElementById('chatButton');
        const chatNotification = document.getElementById('chatNotification');
        // const statusInfo = document.getElementById('statusInfo'); // 🚫 Eliminado
        
        // Modal elementos
        const numberModal = document.getElementById('numberModal');
        const closeModal = document.getElementById('closeModal');
        const selectedNumberDisplay = document.getElementById('selectedNumberDisplay');
        const clientNameInput = document.getElementById('clientName');
        const clientPhoneInput = document.getElementById('clientPhone');
        const statusSelect = document.getElementById('statusSelect');
        const saveButton = document.getElementById('saveButton');
        const payButton = document.getElementById('payButton');
        const deleteButton = document.getElementById('deleteButton');
        const cancelButton = document.getElementById('cancelButton');


        // --- FUNCIÓN DE AUTENTICACIÓN ---
        function setupAuthListeners() {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    authStatus.innerHTML = `<i class="fas fa-user-circle"></i> ${user.email} | Administrador`;
                    // Iniciar la escucha de datos del talonario y el chat
                    startRifaListeners(user.uid);
                    startChatNotificationListener(user.uid);
                } else {
                    currentUser = null;
                    // Si no está logueado, redirigir a la página de login
                    window.location.href = 'index.html'; 
                }
            });
        }

        // --- FUNCIÓN DE GENERACIÓN DE NÚMEROS ---
        function generateNumbersGrid() {
            numbersGrid.innerHTML = '';
            for (let i = 0; i < totalNumbers; i++) {
                const number = i.toString().padStart(2, '0');
                const box = document.createElement('div');
                box.classList.add('number-box');
                box.classList.add('status-disponible');
                box.dataset.number = number;
                box.textContent = number;
                box.onclick = () => openModal(number);
                numbersGrid.appendChild(box);
            }
        }

        // --- FUNCIÓN PARA LISTENER DE RIFAS (BASE DE DATOS) ---
        function startRifaListeners(uid) {
            const rifasRef = collection(db, `users/${uid}/rifas`);
            
            // Escucha en tiempo real de los cambios en la rifa del usuario
            onSnapshot(rifasRef, (snapshot) => {
                const numbers = {};
                let vendidosCount = 0;
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const number = doc.id;
                    numbers[number] = data;

                    if (data.status !== 'disponible') {
                        vendidosCount++;
                    }
                });

                updateNumbersGrid(numbers);
                updateRifasList(numbers);
                // updateStatusInfo(vendidosCount); // 🚫 Eliminado
            }, (error) => {
                console.error("Error al escuchar las rifas:", error);
                mostrarNotificacion("Error de conexión con el talonario.");
            });
        }
        
        // --- FUNCIÓN PARA LISTENER DE CHAT (BASE DE DATOS) ---
        function startChatNotificationListener(uid) {
            const chatRef = collection(db, "chats");
            const userMetadataRef = doc(db, "users", uid, "metadata", "chatStatus");
            const q = query(chatRef, orderBy("timestamp", "desc"), limit(1)); // Último mensaje

            // Listener 1: Obtener el timestamp del último mensaje
            onSnapshot(q, (chatSnapshot) => {
                let latestMessageTimestamp = null;
                if (!chatSnapshot.empty) {
                    latestMessageTimestamp = chatSnapshot.docs[0].data().timestamp;
                }
                
                // Listener 2: Obtener el timestamp del último mensaje leído por el usuario
                onSnapshot(userMetadataRef, (metadataSnapshot) => {
                    let lastReadTimestamp = null;
                    if (metadataSnapshot.exists()) {
                        lastReadTimestamp = metadataSnapshot.data().lastReadTimestamp;
                    }
                    
                    // Comparar y actualizar la notificación
                    updateChatNotification(latestMessageTimestamp, lastReadTimestamp);
                }, (error) => {
                    console.error("Error al escuchar metadatos de lectura:", error);
                });

            }, (error) => {
                console.error("Error al escuchar el último mensaje del chat:", error);
            });
        }
        
        // --- FUNCIÓN PARA ACTUALIZAR NOTIFICACIÓN DE CHAT ---
        function updateChatNotification(latestTimestamp, lastReadTimestamp) {
            let isNewMessage = false;

            if (latestTimestamp) {
                // Convertir Timestamps a milisegundos para una comparación segura
                const latestTimeMs = latestTimestamp.toMillis();
                const lastReadTimeMs = lastReadTimestamp ? lastReadTimestamp.toMillis() : 0;
                
                // Si el último mensaje es posterior al último leído, hay mensajes nuevos.
                if (latestTimeMs > lastReadTimeMs) {
                    isNewMessage = true;
                }
            }

            if (isNewMessage) {
                chatNotification.style.display = 'flex';
                chatNotification.textContent = '1'; // Opcional: Podrías contar el número real si haces una consulta más compleja
            } else {
                chatNotification.style.display = 'none';
            }
        }

        // --- FUNCIÓN PARA ACTUALIZAR LA CUADRÍCULA ---
        function updateNumbersGrid(numbers) {
            for (let i = 0; i < totalNumbers; i++) {
                const number = i.toString().padStart(2, '0');
                const box = numbersGrid.querySelector(`[data-number="${number}"]`);
                
                if (box) {
                    const data = numbers[number];
                    box.className = 'number-box'; // Resetear clases

                    if (data && data.status) {
                        box.classList.add(`status-${data.status}`);
                        // Opcional: Mostrar inicial del cliente o estado en el número
                        box.textContent = number;
                    } else {
                        box.classList.add('status-disponible');
                        box.textContent = number;
                    }
                }
            }
        }

        // --- FUNCIÓN PARA ACTUALIZAR LA LISTA DE RIFAS VENDIDAS ---
        function updateRifasList(numbers) {
            rifasList.innerHTML = '';
            
            // Convertir el objeto de números en un array para ordenar
            const sortedRifas = Object.entries(numbers)
                .filter(([number, data]) => data.status !== 'disponible')
                .sort(([numA, dataA], [numB, dataB]) => {
                    // Ordenar por estado (Pagado primero, Apartado segundo) y luego por número
                    if (dataA.status === 'pagado' && dataB.status !== 'pagado') return -1;
                    if (dataA.status !== 'pagado' && dataB.status === 'pagado') return 1;
                    return numA.localeCompare(numB);
                });

            sortedRifas.forEach(([number, data]) => {
                const card = document.createElement('div');
                card.classList.add('rifa-card');
                
                const statusText = data.status === 'apartado' ? 'Apartado' : 'Pagado';
                const statusClass = data.status === 'apartado' ? 'status-apartado' : 'status-pagado';
                
                // Ajustar el color del borde izquierdo de la tarjeta
                card.style.borderLeftColor = data.status === 'apartado' ? '#f39c12' : '#3498db';

                card.innerHTML = `
                    <div class="rifa-info">
                        <strong>Número: ${number}</strong>
                        <span>${data.clientName || 'Sin Nombre'}</span>
                        <span class="${statusClass}">${statusText}</span>
                    </div>
                    <div class="rifa-buttons">
                        <button onclick="window.open('tel:${data.clientPhone || ''}', '_self')">
                            <i class="fas fa-phone"></i> Llamar
                        </button>
                    </div>
                `;
                
                // Agregar evento para abrir el modal al hacer clic en la tarjeta
                card.onclick = () => openModal(number);
                
                rifasList.appendChild(card);
            });
        }
        
        // --- FUNCIÓN PARA ACTUALIZAR EL VENDIDOS INFO (ANTERIORMENTE statusInfo) ---
        /* 🚫 ELIMINADA:
        function updateStatusInfo(vendidosCount) {
            statusInfo.textContent = `Vendo: ${vendidosCount}/${totalNumbers}`;
        }
        */

        // --- FUNCIÓN PARA ABRIR EL MODAL ---
        async function openModal(number) {
            selectedNumber = number;
            selectedNumberDisplay.textContent = number;
            
            // Resetear y mostrar botones
            saveButton.style.display = 'block';
            payButton.style.display = 'block';
            deleteButton.style.display = 'block';
            
            clientNameInput.value = '';
            clientPhoneInput.value = '';
            statusSelect.value = 'apartado';
            
            // 1. Cargar datos existentes
            if (currentUser) {
                const rifaDocRef = doc(db, `users/${currentUser.uid}/rifas`, number);
                const docSnap = await getDoc(rifaDocRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    clientNameInput.value = data.clientName || '';
                    clientPhoneInput.value = data.clientPhone || '';
                    statusSelect.value = data.status || 'apartado';
                    
                    // Lógica de botones basada en el estado
                    if (data.status === 'pagado') {
                        payButton.style.display = 'none'; // Ya está pagado
                    }
                    if (data.status === 'disponible') {
                        // Si el número está disponible en DB, ocultamos el botón de borrar/pagar hasta que se guarde algo
                        deleteButton.style.display = 'none';
                        payButton.style.display = 'none';
                        statusSelect.value = 'apartado'; // Sugerir apartado al crear
                    }

                } else {
                    // Número no existe, es una nueva creación (Apartado)
                    deleteButton.style.display = 'none';
                    payButton.style.display = 'none'; // No se puede pagar algo que no se ha apartado
                }
            }

            numberModal.style.display = 'block';
        }

        // --- FUNCIÓN PARA CERRAR EL MODAL ---
        function closeModalHandler() {
            numberModal.style.display = 'none';
            selectedNumber = null;
        }

        // --- FUNCIÓN PARA GUARDAR/ACTUALIZAR RIFAS ---
        async function saveRifa() {
            const clientName = clientNameInput.value.trim();
            const clientPhone = clientPhoneInput.value.trim();
            const status = statusSelect.value;
            
            if (!clientName) {
                mostrarNotificacion("⚠️ El nombre del cliente es obligatorio.");
                return;
            }
            
            if (currentUser && selectedNumber) {
                try {
                    const rifaDocRef = doc(db, `users/${currentUser.uid}/rifas`, selectedNumber);
                    
                    await setDoc(rifaDocRef, {
                        clientName: clientName,
                        clientPhone: clientPhone,
                        status: status,
                        updatedAt: Timestamp.now()
                    }, { merge: true });

                    mostrarNotificacion(`✅ Número ${selectedNumber} guardado como: ${status}.`);
                    closeModalHandler();

                } catch (error) {
                    console.error("Error al guardar la rifa:", error);
                    mostrarNotificacion("⚠️ Error al guardar los datos.");
                }
            }
        }
        
        // --- FUNCIÓN PARA MARCAR COMO PAGADO ---
        async function markAsPaid() {
            if (currentUser && selectedNumber) {
                try {
                    const rifaDocRef = doc(db, `users/${currentUser.uid}/rifas`, selectedNumber);
                    
                    await setDoc(rifaDocRef, {
                        status: 'pagado',
                        updatedAt: Timestamp.now()
                    }, { merge: true });

                    mostrarNotificacion(`✅ Número ${selectedNumber} marcado como PAGADO.`);
                    closeModalHandler();

                } catch (error) {
                    console.error("Error al marcar como pagado:", error);
                    mostrarNotificacion("⚠️ Error al actualizar estado de pago.");
                }
            }
        }

        // --- FUNCIÓN PARA ELIMINAR RIFAS ---
        async function deleteRifa() {
            if (currentUser && selectedNumber) {
                if (!confirm(`¿Estás seguro de que quieres liberar el número ${selectedNumber}?`)) {
                    return;
                }
                
                try {
                    const rifaDocRef = doc(db, `users/${currentUser.uid}/rifas`, selectedNumber);
                    await deleteDoc(rifaDocRef);
                    
                    mostrarNotificacion(`🗑️ Número ${selectedNumber} liberado (Disponible).`);
                    closeModalHandler();

                } catch (error) {
                    console.error("Error al eliminar la rifa:", error);
                    mostrarNotificacion("⚠️ Error al liberar el número.");
                }
            }
        }
        
        // --- FUNCIÓN DE NOTIFICACIÓN ---
        function mostrarNotificacion(mensaje) {
            const notificacion = document.getElementById('notificacion');
            const mensajeNotificacion = document.getElementById('mensajeNotificacion');
            
            notificacion.style.background = mensaje.includes('Error') || mensaje.includes('⚠️') ? '#ff4757' : '#2ecc71';
            notificacion.style.boxShadow = mensaje.includes('Error') || mensaje.includes('⚠️') ? '0 0 15px rgba(255, 71, 87, 0.7)' : '0 0 15px rgba(46, 204, 113, 0.7)';
            
            mensajeNotificacion.textContent = mensaje;
            
            // Reiniciar animación
            notificacion.style.animation = 'none';
            notificacion.offsetHeight; 
            notificacion.style.animation = 'slideIn 0.5s ease forwards, slideOut 0.5s ease 2.5s forwards';

            notificacion.style.display = 'block';
            setTimeout(() => { notificacion.style.display = 'none'; }, 3000);
        }

        // --- INICIALIZACIÓN Y LISTENERS DE EVENTOS ---
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Generar la cuadrícula de 00 a 99
            generateNumbersGrid();
            
            // 2. Iniciar la verificación de sesión
            setupAuthListeners();
            
            // 3. Botones del modal
            closeModal.onclick = closeModalHandler;
            cancelButton.onclick = closeModalHandler;
            saveButton.onclick = saveRifa;
            payButton.onclick = markAsPaid;
            deleteButton.onclick = deleteRifa;
            
            // Cerrar modal al hacer clic fuera
            window.onclick = (event) => {
                if (event.target == numberModal) {
                    closeModalHandler();
                }
            }
            
            // 4. Botón de Cerrar Sesión
            logoutButton.onclick = async () => {
                try {
                    await signOut(auth);
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error("Error al cerrar sesión:", error);
                    mostrarNotificacion("⚠️ Error al cerrar sesión.");
                }
            };
            
            // 5. Botón de Chat
            chatButton.onclick = () => {
                window.location.href = 'chat.html';
            };
        });
    </script>
</body>
</html>
